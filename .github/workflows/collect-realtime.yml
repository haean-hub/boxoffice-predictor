name: Collect KOBIS Real-time Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boxoffice-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect validated snapshot
        run: python scripts/collect_realtime.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/realtime.json
          if ! git diff --cached --quiet; then
            git commit -m "Save KOBIS real-time snapshot"
            git pull --rebase
            git push
          fi
